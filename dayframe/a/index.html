<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#FAF7F2">
<link rel="stylesheet" href="/dayframe/style.css">
<title>Dayframe</title>
</head>
<body data-page="ask">
  <main>
    <div class="brand"><span class="dot" aria-hidden="true"></span>Dayframe</div>
    <div id="content">
      <section class="card">
        <p class="label" id="asked-you"></p>
        <p class="question" id="question"></p>
      </section>
      <section class="card">
        <label class="field" for="name"><span id="name-label">Your name</span></label>
        <input type="text" id="name" autocomplete="name" autocapitalize="words" enterkeyhint="next">
        <div class="gap" aria-hidden="true"></div>
        <label class="field" for="answer"><span id="answer-label">Your answer</span></label>
        <textarea id="answer" rows="5"></textarea>
        <div class="counter" id="counter" aria-live="polite"></div>
        <div class="gap" aria-hidden="true"></div>
        <button type="button" class="btn btn-primary" id="send" disabled>Send answer</button>
        <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
      </section>
    </div>
    <section id="error" class="card error" hidden>
      <h1 id="error-title"></h1>
      <p id="error-body"></p>
    </section>
    <section class="promo">
      <p id="promo-text">Use Dayframe to keep your own daily answers</p>
      <a id="get-app" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.tallowbird.dayframe" rel="noopener">Get the app</a>
    </section>
  </main>
  <script src="/dayframe/app.js"></script>
</body>
</html>
